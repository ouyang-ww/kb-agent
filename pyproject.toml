[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-agent"
version = "0.1.0"
description = "Personal knowledge base RAG agent (retrieval, management, evaluation, multimodal)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "sentence-transformers>=2.7",
    "chromadb>=0.4.24",
    "openai>=1.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "gradio>=4.44",
    "pypdf>=4.2",
]

[project.optional-dependencies]
vision = [
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
]
local-vision = ["transformers>=4.40"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
kb = "kbagent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
